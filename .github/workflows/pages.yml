name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Beta release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Build public product and beta pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease > "$RUNNER_TEMP/releases.json"
          tag="$(node scripts/beta-release.mjs select "$RUNNER_TEMP/releases.json")"
          if [[ -n "$tag" ]]; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,publishedAt,targetCommitish,assets > "$RUNNER_TEMP/release.json"
            mkdir -p "$RUNNER_TEMP/release-assets"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release-assets"
            node scripts/public-site.mjs build --out dist --release "$RUNNER_TEMP/release.json" --checksums "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
          else
            node scripts/public-site.mjs build --out dist
          fi
      - name: Add architecture page
        # Public map of the app's modules (docs/architecture/navigator.html), served at <site>/architecture/.
        run: mkdir -p dist/architecture && cp docs/architecture/navigator.html dist/architecture/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
