name: Beta release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: beta-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            source_sha="$TESTED_SHA"
          else
            source_sha="$DISPATCH_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Confirm manual source passed main CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$SOURCE_SHA" --event push --status completed --limit 20 --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          test "$passed" = "true"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Derive unique beta version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(node scripts/beta-release.mjs version package.json "$RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set runner-only beta version
        run: npm version "$env:VERSION" --no-git-tag-version --ignore-scripts
      - run: npm run build
      - name: Build unsigned Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Validate packaged application
        run: |
          node scripts/check-package.mjs release/win-unpacked
          $installer = "release/LV-Design-Studio-$env:VERSION-win-x64.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "Windows installer is missing" }
          if ((Get-AuthenticodeSignature $installer).Status -ne 'NotSigned') { throw "Windows beta must be unsigned" }
      # The packaged lvds command and MCP server, run by the app as Node. The Windows launcher (build/lvds/lvds.cmd)
      # has only ever run on this runner, so a failure is reported here without stopping the beta.
      - name: Packaged command line and MCP server
        continue-on-error: true
        run: node scripts/check-packaged-lvds.mjs release/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: beta-windows-${{ needs.prepare.outputs.version }}
          path: release/LV-Design-Studio-${{ needs.prepare.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set runner-only beta version
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts
      - run: npm run build
      - name: Build unsigned Apple-silicon installer
        run: npx electron-builder --mac dmg --arm64 --config.mac.identity=null --publish never
      - name: Validate packaged application
        run: |
          set -euo pipefail
          node scripts/check-package.mjs "release/mac-arm64/LV Design Studio.app"
          node scripts/check-packaged-lvds.mjs "release/mac-arm64/LV Design Studio.app"
          test -f "release/LV-Design-Studio-$VERSION-mac-arm64.dmg"
          if codesign --verify --deep --strict "release/mac-arm64/LV Design Studio.app" >/dev/null 2>&1; then
            echo "macOS beta must be unsigned" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: beta-macos-${{ needs.prepare.outputs.version }}
          path: release/LV-Design-Studio-${{ needs.prepare.outputs.version }}-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: beta-*-${{ needs.prepare.outputs.version }}
          path: release-assets
          merge-multiple: true
      - name: Prepare checksums and release notes
        run: |
          set -euo pipefail
          node scripts/beta-release.mjs checksums release-assets "$VERSION" release-assets/SHA256SUMS.txt
          node scripts/beta-release.mjs notes "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub prerelease
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$tag" \
            "release-assets/LV-Design-Studio-$VERSION-win-x64.exe" \
            "release-assets/LV-Design-Studio-$VERSION-mac-arm64.dmg" \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "LV Design Studio $VERSION (unsigned beta)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
